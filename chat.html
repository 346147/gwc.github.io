    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                
                const colors = ['#FFD700', '#FF7F50', '#FFFFFF'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    this.x -= dx * force * 0.02;
                    this.y -= dy * force * 0.02;
                }
                
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createParticles() {
            particles = [];
            const particleCount = Math.floor(Math.random() * 10) + 30;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        createParticles();
        animate();

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        function loadChat() {
            const userName = getQueryParam('name');
            if (userName && chatData[userName]) {
                const user = chatData[userName];
                const avatarElement = document.getElementById('chatAvatar');
                
                // 检查是否为图片路径
                if (user.avatar.includes('.')) {
                    avatarElement.style.background = `url('${user.avatar}')`;
                    avatarElement.style.backgroundSize = 'cover';
                    avatarElement.style.backgroundPosition = 'center';
                    avatarElement.textContent = '';
                } else {
                    avatarElement.style.background = '';
                    avatarElement.textContent = user.avatar;
                }
                
                document.getElementById('chatUserName').textContent = userName;
                
                renderMessages(user.messages);
            }
        }
        
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.type}">
                    <div>${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            const container = document.getElementById('chatMessages');
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message sent';
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            input.value = '';
            
            setTimeout(() => {
                const replies = [
                    '好的，收到！',
                    '明白了～',
                    '加油！💪',
                    '继续努力！',
                    '有道理！',
                    '谢谢分享！',
                    '一起加油！',
                    '坚持就是胜利！'
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyTime = new Date();
                const replyTimeStr = replyTime.getHours().toString().padStart(2, '0') + ':' + replyTime.getMinutes().toString().padStart(2, '0');
                
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message received';
                replyDiv.innerHTML = `
                    <div>${randomReply}</div>
                    <div class="message-time">${replyTimeStr}</div>
                `;
                
                container.appendChild(replyDiv);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }
        
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        loadChat();
    </script>

    <script>
        // 登录模态框功能
        function openLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        document.getElementById('loginModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLoginModal();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLoginModal();
                closeShareModal();
            }
        });
        
        // 分享模态框功能
        function openShareModal() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            const shareLinkInput = document.getElementById('shareLink');
            
            // 设置分享链接为当前页面URL
            shareLinkInput.value = window.location.href;
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeShareModal() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        function copyLink() {
            const shareLinkInput = document.getElementById('shareLink');
            shareLinkInput.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            const copyBtn = shareLinkInput.nextElementSibling;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '已复制';
            copyBtn.style.background = '#4CAF50';
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '#FF7F50';
            }, 2000);
        }
        
        function shareToWeChat() {
            // 模拟微信分享
            alert('已复制链接到剪贴板，请在微信中粘贴分享');
            closeShareModal();
        }
        
        function shareToQQ() {
            // 模拟QQ分享
            const shareUrl = encodeURIComponent(window.location.href);
            const title = encodeURIComponent('健谈 FitChat - 私信');
            const qqShareUrl = `https://connect.qq.com/widget/shareqq/index.html?url=${shareUrl}&title=${title}`;
            window.open(qqShareUrl, '_blank', 'width=600,height=400');
        }
        
        document.getElementById('shareModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeShareModal();
            }
        });
    </script>
