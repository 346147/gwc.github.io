<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - 健谈 FitChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Noto Sans SC', sans-serif;
            color: white;
            overflow-x: hidden;
            overflow-y: auto;
            background: #1E3A5F;
        }
        
        .page-container {
            position: relative;
            width: 100vw;
            min-height: 100vh;
        }
        
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(30, 58, 95, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        
        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 10px;
            cursor: pointer;
        }
        
        .header-dumbbell {
            width: 32px;
            height: 20px;
        }
        
        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 40px;
            position: relative;
        }
        
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
        }
        
        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .user-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 10px;
        }
        
        .notification-icon, .user-icon {
            position: relative;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }
        
        .notification-icon span, .user-icon span {
            display: inline-block;
            filter: brightness(0) invert(1);
        }
        
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            min-width: 18px;
            height: 18px;
            background: #ff7f50;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            color: white;
        }
        
        .main-content {
            position: relative;
            z-index: 1;
            width: 900px;
            margin: 0 auto;
            padding-top: 100px;
            padding-bottom: 60px;
        }
        
        .user-profile-card {
            background: rgba(30, 58, 95, 0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF7F50, #FFD700);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .profile-badge {
            font-size: 14px;
            padding: 4px 12px;
            background: rgba(255, 127, 80, 0.2);
            border-radius: 12px;
            color: #FF7F50;
        }
        
        .profile-bio {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #FF7F50;
        }
        
        .stat-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }
        
        .profile-actions {
            display: flex;
            gap: 12px;
        }
        
        .follow-btn {
            padding: 10px 30px;
            background: linear-gradient(135deg, #FF7F50, #FFD700);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .follow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 127, 80, 0.4);
        }
        
        .message-btn {
            padding: 10px 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .message-btn:hover {
            border-color: #FF7F50;
            color: #FF7F50;
        }
        
        .checkin-banner {
            background: linear-gradient(135deg, rgba(255, 127, 80, 0.3), rgba(255, 215, 0, 0.2));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .checkin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .checkin-days {
            font-size: 36px;
            font-weight: 700;
            color: #FFD700;
        }
        
        .checkin-days span {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .checkin-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .tabs-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .tab-btn:hover {
            background: rgba(255, 127, 80, 0.2);
            color: #FF7F50;
        }
        
        .tab-btn.active {
            background: #FF7F50;
            color: white;
        }
        
        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .post-card {
            background: rgba(30, 58, 95, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .post-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 127, 80, 0.5);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .post-time {
            font-size: 13px;
            color: #9CA3AF;
        }
        
        .board-tag {
            background: rgba(255, 127, 80, 0.2);
            color: #FF7F50;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }
        
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
        }
        
        .post-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .post-image {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            overflow: hidden;
        }
        
        .post-image img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }
        
        .post-actions {
            display: flex;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .action-btn:hover {
            color: #FF7F50;
            transform: scale(1.05);
        }
        
        .action-btn.liked {
            color: #FF7F50;
        }
        
        .back-btn {
            position: fixed;
            top: 80px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(30, 58, 95, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 50;
        }
        
        .back-btn:hover {
            background: rgba(255, 127, 80, 0.3);
            border-color: #FF7F50;
        }
        
        /* AI助手样式 */
        .ai-assistant-btn {
            position: fixed;
            bottom: 120px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4A90E2, #7B68EE);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
        }
        
        .ai-assistant-btn:hover {
            box-shadow: 0 6px 30px rgba(74, 144, 226, 0.6);
            transform: scale(1.1);
        }
        
        .ai-assistant-btn span {
            font-size: 28px;
        }
        
        .ai-assistant-window {
            position: fixed;
            bottom: 200px;
            right: 40px;
            width: 380px;
            height: 500px;
            background: rgba(30, 58, 95, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .ai-assistant-window.active {
            display: flex;
        }
        
        .ai-assistant-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: linear-gradient(135deg, #4A90E2, #7B68EE);
            color: white;
        }
        
        .ai-assistant-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .ai-assistant-close {
            cursor: pointer;
            font-size: 20px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        
        .ai-assistant-close:hover {
            opacity: 1;
        }
        
        .ai-assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .ai-message {
            display: flex;
            gap: 10px;
        }
        
        .ai-message-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
            white-space: pre-line;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .user-message .ai-message-content {
            background: linear-gradient(135deg, #FF7F50, #FFD700);
            color: white;
        }
        
        .ai-assistant-input {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ai-assistant-input input {
            flex: 1;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 0 16px;
            font-size: 14px;
            color: white;
            outline: none;
        }
        
        .ai-assistant-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .ai-assistant-input input:focus {
            border-color: #4A90E2;
        }
        
        .ai-assistant-input button {
            height: 40px;
            padding: 0 20px;
            background: linear-gradient(135deg, #4A90E2, #7B68EE);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ai-assistant-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        }
        
        /* 登录模态框样式 */
        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-modal-overlay.active {
            display: flex;
        }
        
        .login-modal {
            width: 400px;
            background: rgba(30, 58, 95, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .login-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            color: white;
        }
        
        .login-modal-close:hover {
            background: rgba(255, 127, 80, 0.3);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 60px;
            height: 36px;
            margin: 0 auto 12px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .login-form {
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-input {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-input:focus {
            outline: none;
            border-color: #FF7F50;
        }
        
        .login-btn {
            width: 100%;
            height: 48px;
            background: #FF7F50;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: #FF6B3D;
            transform: translateY(-2px);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .divider-text {
            margin: 0 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }
        
        .social-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            background: rgba(255, 127, 80, 0.2);
            transform: translateY(-2px);
        }
        
        .register-section {
            text-align: center;
            font-size: 14px;
        }
        
        .register-text {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .register-link {
            color: #FF7F50;
            text-decoration: none;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <canvas id="particle-canvas"></canvas>
        
        <div class="header">
            <div class="header-logo" onclick="window.location.href='index.html'">
                <svg class="header-dumbbell" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="0" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="90" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="94" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="15" y="27" width="70" height="6" rx="3" fill="#FF7F50"/>
                </svg>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="搜索讨论">
            </div>
            <div class="user-controls">
                <div class="notification-icon" onclick="window.location.href='messages.html'" style="cursor: pointer;">
                    <span>🔔</span>
                    <div class="notification-badge">3</div>
                </div>
                <div class="user-icon" onclick="openLoginModal()" style="cursor: pointer;">
                    <span>👤</span>
                </div>
            </div>
        </div>
        
        <button class="back-btn" onclick="history.back()">← 返回</button>
        
        <div class="main-content">
            <div class="user-profile-card">
                <div class="profile-avatar" id="profileAvatar">🏃</div>
                <div class="profile-info">
                    <div class="profile-name">
                        <span id="profileName">跑步小妹</span>
                        <span class="profile-badge" id="profileBadge">🔥 打卡达人</span>
                    </div>
                    <div class="profile-bio" id="profileBio">热爱跑步，坚持打卡21天！每天进步一点点，一起加油吧～</div>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-number" id="statPosts">128</div>
                            <div class="stat-label">帖子</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statLikes">2.5k</div>
                            <div class="stat-label">获赞</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statFollowers">856</div>
                            <div class="stat-label">粉丝</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statFollowing">128</div>
                            <div class="stat-label">关注</div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button class="follow-btn" id="followBtn" onclick="toggleFollow()">+ 关注</button>
                        <button class="message-btn" id="messageBtn" onclick="goToChat()">私信</button>
                    </div>
                </div>
            </div>
            
            <div class="checkin-banner">
                <div class="checkin-info">
                    <div class="checkin-days"><span id="checkinDays">21</span><span> 天</span></div>
                    <div>
                        <div style="font-weight: 600; margin-bottom: 4px;">连续打卡</div>
                        <div class="checkin-text">坚持就是胜利！</div>
                    </div>
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tab-btn active" data-tab="posts">📝 动态</div>
                <div class="tab-btn" data-tab="likes">❤️ 喜欢</div>
                <div class="tab-btn" data-tab="collections">⭐ 收藏</div>
            </div>
            
            <div class="posts-container" id="postsContainer">
            </div>
        </div>
    </div>
    
    <!-- 登录模态框 -->
    <div class="login-modal-overlay" id="loginModalOverlay">
        <div class="login-modal">
            <div class="login-modal-close" onclick="closeLoginModal()">✕</div>
            
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="0" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="90" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="94" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="15" y="27" width="70" height="6" rx="3" fill="#FF7F50"/>
                </svg>
                <div class="logo-text">健谈</div>
                <div class="logo-subtitle">FitChat</div>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="手机号 / 邮箱" id="username" required>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                
                const colors = ['#FFD700', '#FF7F50', '#FFFFFF'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    this.x -= dx * force * 0.02;
                    this.y -= dy * force * 0.02;
                }
                
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createParticles() {
            particles = [];
            const particleCount = Math.floor(Math.random() * 10) + 30;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        createParticles();
        animate();

        function loadUserData() {
            const userName = getQueryParam('name');
            if (userName && usersData[userName]) {
                const user = usersData[userName];
                currentUserData = user;
                currentUserName = userName;
                
                const profileAvatar = document.getElementById('profileAvatar');
                if (user.avatar.includes('.')) {
                    // 如果是图片路径
                    profileAvatar.style.background = `url('${user.avatar}')`;
                    profileAvatar.style.backgroundSize = 'cover';
                    profileAvatar.style.backgroundPosition = 'center';
                    profileAvatar.textContent = '';
                } else {
                    // 如果是emoji
                    profileAvatar.textContent = user.avatar;
                    profileAvatar.style.background = '';
                }
                document.getElementById('profileName').textContent = userName;
                document.getElementById('profileBadge').textContent = user.badge;
                document.getElementById('profileBio').textContent = user.bio;
                document.getElementById('statPosts').textContent = user.posts;
                document.getElementById('statLikes').textContent = user.likes;
                document.getElementById('statFollowers').textContent = user.followers;
                document.getElementById('statFollowing').textContent = user.following;
                document.getElementById('checkinDays').textContent = user.checkinDays;
                
                renderPosts(user.userPosts || []);

                '瑜伽导师': '图片/瑜伽导师/头像.png',
                '营养师小王': '图片/营养师小王/营养师小王头像.png',
                '挑战王者': '图片/挑战王者/头像.png',
                '目标达人': '图片/目标达人/头像.png',
                '完赛英雄': '图片/完赛英雄/头像.png',
                '健身老司机': '图片/健身老司机/头像.png',
                '新手小白': '图片/新手小白/头像.png',
                '资深教练': '图片/资深教练/头像.png',
                '健身达人': '图片/肌肉教练/头像.png',
                '跑步爱好者': '图片/跑步小妹/头像.png',
                '瑜伽老师': '图片/瑜伽静静/头像.png',
                '冥想大师': '图片/瑜伽导师/头像.png',
                '美食博主': '图片/营养师小王/营养师小王头像.png',
                '轻食专家': '图片/营养师小王/营养师小王头像.png',
                '晓晓': '图片/晓晓/头像.png',
                '大熊': '图片/大熊/头像.png',
                '莉莉': '图片/莉莉/头像.png'
            };
            return avatarMap[author] || '';
        }
        
        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">暂无内容</div>';
                return;
            }
            const userAvatar = currentUserData?.avatar || '';
            const avatarStyle = userAvatar.includes('.') ? 
                `background: url('${userAvatar}'); background-size: cover; background-position: center;` : '';
            const avatarContent = userAvatar.includes('.') ? '' : userAvatar;
            
            container.innerHTML = posts.map(post => `
                <div class="post-card" onclick="window.location.href='post-detail.html?id=${post.id || 1}'">
                    <div class="post-header" style="display: flex; align-items: center;">
                        <div class="user-avatar" onclick="event.stopPropagation(); window.location.href='user-detail.html?name=${encodeURIComponent(currentUserName)}'" style="width: 32px; height: 32px; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; ${avatarStyle}; cursor: pointer;">${avatarContent}</div>
                        <div class="user-info" style="flex: 1;">
                            <div class="user-name" onclick="event.stopPropagation(); window.location.href='user-detail.html?name=${encodeURIComponent(currentUserName)}'" style="font-size: 14px; cursor: pointer;">${currentUserName}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                        <div class="board-tag">${post.tag}</div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${post.image ? `<div class="post-images"><div class="post-image"><img src="${post.image}" alt="帖子图片"></div></div>` : ''}
                    <div class="post-actions">
                        <div class="action-btn">
                            <span>🤍</span>
                            <span>${post.likes}</span>
                        </div>
                        ${post.comments !== undefined ? `<div class="action-btn"><span>💬</span><span>${post.comments}</span></div>` : ''}
                        <div class="action-btn" onclick="event.stopPropagation(); sharePost();">
                            <span>↗️</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderLikedPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">暂无喜欢的内容</div>';
                return;
            }
            container.innerHTML = posts.map(post => {
                const avatarPath = getAvatarPath(post.author);
                const avatarStyle = avatarPath ? 
                    `background: url('${avatarPath}'); background-size: cover; background-position: center;` : 
                    'background: linear-gradient(135deg, #FF7F50, #FFD700);';
                const avatarContent = avatarPath ? '' : `<span style="font-size: 20px;">${post.authorAvatar || '👤'}</span>`;
                
                return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-avatar" style="width: 32px; height: 32px; margin-right: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; ${avatarStyle}" onclick="event.stopPropagation(); goToUser('${post.author}')">${avatarContent}</div>
                        <div class="user-info" style="flex: 1;">
                            <div class="user-name" style="font-size: 14px; cursor: pointer;" onclick="event.stopPropagation(); goToUser('${post.author}')">${post.author}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                        <div class="board-tag">${post.tag}</div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions">
                        <div class="action-btn liked">
                            <span>❤️</span>
                            <span>${post.likes}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        
        function renderCollectedPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">暂无收藏的内容</div>';
                return;
            }
            container.innerHTML = posts.map(post => {
                const avatarPath = getAvatarPath(post.author);
                const avatarStyle = avatarPath ?
                    `background: url('${avatarPath}'); background-size: cover; background-position: center;` :
                    'background: linear-gradient(135deg, #FF7F50, #FFD700);';
                const avatarContent = avatarPath ? '' : `<span style="font-size: 20px;">${post.authorAvatar || '👤'}</span>`;

                return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-avatar" style="width: 32px; height: 32px; margin-right: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; ${avatarStyle}" onclick="event.stopPropagation(); goToUser('${post.author}')">${avatarContent}</div>
                        <div class="user-info" style="flex: 1;">
                            <div class="user-name" style="font-size: 14px; cursor: pointer;" onclick="event.stopPropagation(); goToUser('${post.author}')">${post.author}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                        <div class="board-tag">${post.tag}</div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions">
                        <div class="action-btn">
                            <span>⭐</span>
                            <span>已收藏</span>
                        </div>
                        <div class="action-btn">
                            <span>🤍</span>
                            <span>${post.likes}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabName = this.getAttribute('data-tab');
                if (tabName === 'posts') {
                    renderPosts(currentUserData?.userPosts || []);
                } else if (tabName === 'likes') {
                    renderLikedPosts(currentUserData?.likedPosts || []);
                } else if (tabName === 'collections') {
                    renderCollectedPosts(currentUserData?.collectedPosts || []);
                }
            });
        });
        
        let isFollowing = false;
        
        function toggleFollow() {
            const btn = document.getElementById('followBtn');
            const followersCount = document.getElementById('statFollowers');
            let count = parseInt(followersCount.textContent);
            
            if (isFollowing) {
                btn.textContent = '+ 关注';
                btn.style.background = 'linear-gradient(135deg, #FF7F50, #FFD700)';
                followersCount.textContent = count - 1;
                isFollowing = false;
            } else {
                btn.textContent = '取消关注';
                btn.style.background = 'rgba(255, 255, 255, 0.2)';
                followersCount.textContent = count + 1;
                isFollowing = true;
            }
        }
        
        function goToUser(userName) {
            if (userName) {
                window.location.href = 'user-detail.html?name=' + encodeURIComponent(userName);
            }
        }

        function goToChat() {
            const userName = getQueryParam('name');
            if (userName) {
                window.location.href = 'chat.html?name=' + encodeURIComponent(userName);
            }
        }
        
        function setupLikeButtons() {
            document.querySelectorAll('.post-actions .action-btn').forEach(btn => {
                const heartIcon = btn.querySelector('span:first-child');
                if (heartIcon && (heartIcon.textContent === '🤍' || heartIcon.textContent === '❤️')) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const countSpan = btn.querySelector('span:last-child');
                        let count = parseInt(countSpan.textContent);
                        
                        if (btn.classList.contains('liked')) {
                            btn.classList.remove('liked');
                            heartIcon.textContent = '🤍';
                            countSpan.textContent = count - 1;
                        } else {
                            btn.classList.add('liked');
                            heartIcon.textContent = '❤️';
                            countSpan.textContent = count + 1;
                            btn.style.transform = 'scale(1.3)';
                            setTimeout(() => {
                                btn.style.transform = 'scale(1)';
                            }, 200);
                        }
                    });
                }
            });
        }
        
        loadUserData();
        
        setTimeout(setupLikeButtons, 100);
        
        // 登录模态框功能
        function openLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        document.getElementById('loginModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLoginModal();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLoginModal();
                closeShareModal();
            }
        });
        
        // 分享功能
        function sharePost() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeShareModal() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        function copyLink() {
            const shareLink = document.getElementById('shareLink');
            shareLink.select();
            document.execCommand('copy');
            alert('链接已复制到剪贴板！');
        }
        
        function shareToWechat() {
            alert('分享到微信功能演示：请使用微信扫码分享！');
        }
        
        function shareToQQ() {
            alert('分享到QQ功能演示：已打开QQ分享界面！');
        }
        
        // 点击遮罩层关闭分享模态框
        document.getElementById('shareModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeShareModal();
            }
        });
        
        // AI助手功能
        function toggleAIAssistant() {
            const window = document.getElementById('aiAssistantWindow');
            window.classList.toggle('active');
        }
        
        function handleAIKeyPress(event) {
            if (event.key === 'Enter') {
                sendAIMessage();
            }
        }
        
        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            
            setTimeout(() => {
                const response = getAIResponse(message);
                addMessage(response, false);
            }, 500);
        }
        
        function addMessage(text, isUser) {
            const messagesContainer = document.getElementById('aiMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'ai-message user-message' : 'ai-message';
            messageDiv.innerHTML = `<div class="ai-message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function getAIResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            if (lowerMessage.includes('减肥') || lowerMessage.includes('减脂')) {
                return '减肥的关键是"三分练，七分吃"。建议你：\n1. 控制热量摄入，保持热量缺口\n2. 多做有氧运动，如跑步、游泳\n3. 配合力量训练，提高基础代谢\n4. 保证充足睡眠，促进脂肪燃烧';
            }
            
            if (lowerMessage.includes('增肌') || lowerMessage.includes('肌肉')) {
                return '增肌需要科学训练和营养补充：\n1. 每周3-4次力量训练，注重复合动作\n2. 保证蛋白质摄入（每公斤体重1.6-2.2g）\n3. 充足休息，肌肉在休息时生长\n4. 循序渐进，逐渐增加训练强度';
            }
            
            if (lowerMessage.includes('跑步') || lowerMessage.includes('有氧')) {
                return '跑步是很好的有氧运动！建议：\n1. 初学者从慢跑开始，逐渐增加距离\n2. 注意跑姿，避免膝盖受伤\n3. 选择合适的跑鞋\n4. 跑前热身，跑后拉伸\n5. 每周跑量增加不超过10%';
            }
            
            if (lowerMessage.includes('瑜伽') || lowerMessage.includes('拉伸')) {
                return '瑜伽可以改善柔韧性和身心状态：\n1. 从基础体式开始，不要急于求成\n2. 注意呼吸配合，保持专注\n3. 每次练习15-30分钟即可\n4. 坚持练习，效果会越来越好';
            }
            
            if (lowerMessage.includes('饮食') || lowerMessage.includes('营养') || lowerMessage.includes('吃')) {
                return '健康饮食建议：\n1. 均衡摄入蛋白质、碳水化合物和脂肪\n2. 多吃蔬菜水果，补充维生素\n3. 少油少盐少糖\n4. 定时定量，避免暴饮暴食\n5. 多喝水，每天至少2升';
            }
            
            if (lowerMessage.includes('打卡') || lowerMessage.includes('坚持')) {
                return '坚持打卡很重要！建议：\n1. 设定明确的目标\n2. 制定可行的计划\n3. 找到健身伙伴互相监督\n4. 记录进步，给自己奖励\n5. 把健身变成习惯，而不是负担';
            }
            
            if (lowerMessage.includes('你好') || lowerMessage.includes('hi') || lowerMessage.includes('hello')) {
                return '你好！我是你的健身助手，有什么可以帮助你的吗？你可以问我关于减肥、增肌、跑步、瑜伽、饮食等健身相关的问题。';
            }
            
            if (lowerMessage.includes('谢谢') || lowerMessage.includes('感谢')) {
                return '不客气！如果还有其他问题，随时可以问我。祝你健身愉快！💪';
            }
            
            return '我理解你的问题。健身是一个循序渐进的过程，建议你：\n1. 制定合理的目标\n2. 坚持训练计划\n3. 注意饮食营养\n4. 保证充足休息\n\n如果你想了解更具体的内容，可以问我关于减肥、增肌、跑步、瑜伽或饮食的问题。';
        }
    </script>
