    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                
                const colors = ['#FFD700', '#FF7F50', '#FFFFFF'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    this.x -= dx * force * 0.02;
                    this.y -= dy * force * 0.02;
                }
                
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function createParticles() {
            particles = [];
            const particleCount = Math.floor(Math.random() * 10) + 30;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

                { id: 10, sender: '莉莉', avatar: '图片/莉莉/头像.png', type: 'like', text: '赞了你的帖子「瑜伽初学者常见问题解答」', time: '2 天前', unread: false, postId: 9 }
            ],
            comments: [
                { id: 2, sender: '增肌阿杰', avatar: '图片/增肌阿杰/头像.png', type: 'comment', text: '评论了你的帖子：太棒了！坚持就是胜利！', time: '5 分钟前', unread: true, postId: 1 },
                { id: 5, sender: '晨跑小王子', avatar: '图片/晨跑小王子/头像.png', type: 'comment', text: '评论了你的帖子「半马训练完成！21 公里，配速 5 分 45 秒」', time: '1 小时前', unread: false, postId: 4 },
                { id: 9, sender: '大熊', avatar: '图片/大熊/头像.png', type: 'comment', text: '评论了你的帖子「终于突破了 10 公里！从刚开始跑 1 公里都喘到现在」', time: '昨天', unread: false, postId: 7 }
            ],
            follows: [
                { id: 3, sender: '马拉松狂人', avatar: '图片/马拉松狂人/头像.png', type: 'follow', text: '关注了你', time: '10分钟前', unread: true },
                { id: 7, sender: '力量王者', avatar: '图片/力量王者/头像.png', type: 'follow', text: '关注了你', time: '3小时前', unread: false }
            ],
            system: [
                { id: 8, sender: '系统通知', avatar: '📢', type: 'system', text: '恭喜你获得「坚持打卡」徽章！', time: '昨天', unread: false },
                { id: 11, sender: '系统通知', avatar: '📢', type: 'system', text: '欢迎加入健谈社区！开始你的健身之旅吧～', time: '1周前', unread: false }
            ]
        };
        
        function getTypeClass(type) {
            switch(type) {
                case 'like': return 'type-like';
                case 'comment': return 'type-comment';
                case 'follow': return 'type-follow';
                case 'system': return 'type-system';
                default: return 'type-system';
            }
        }
        
        function getTypeText(type) {
            switch(type) {
                case 'like': return '点赞';
                case 'comment': return '评论';
                case 'follow': return '关注';
                case 'system': return '系统';
                default: return '通知';
            }
        }
        
        function renderMessages(tabName) {
            const messages = messagesData[tabName] || [];
            const container = document.getElementById('messageList');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">暂无消息</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = messages.map(msg => {
                let avatarHtml = '';
                if (msg.avatar.includes('.')) {
                    // 如果是图片路径
                    avatarHtml = `<div class="message-avatar" style="background: url('${msg.avatar}'); background-size: cover; background-position: center;" onclick="event.stopPropagation(); goToUserProfile('${msg.sender}')"></div>`;
                } else {
                    // 如果是emoji
                    avatarHtml = `<div class="message-avatar" onclick="event.stopPropagation(); goToUserProfile('${msg.sender}')">${msg.avatar}</div>`;
                }
                return `
                    <div class="message-item ${msg.unread ? 'unread' : ''}" onclick="handleMessageClick('${msg.type}', ${msg.postId || 'null'})">
                        ${avatarHtml}
                        <div class="message-content">
                            <div class="message-header">
                                <div>
                                    <span class="message-sender" onclick="event.stopPropagation(); goToUserProfile('${msg.sender}')">${msg.sender}</span>
                                    <span class="message-type ${getTypeClass(msg.type)}">${getTypeText(msg.type)}</span>
                                </div>
                                <span class="message-time">${msg.time}</span>
                            </div>
                            <div class="message-text">${msg.text}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function handleMessageClick(type, postId) {
            if (type === 'like' || type === 'comment') {
                window.location.href = 'post-detail.html?id=' + (postId || 1);
            } else if (type === 'follow') {
                // 关注消息不跳转，因为点击头像或用户名已经会跳转到用户详情页
                console.log('关注消息');
            } else {
                console.log('系统消息');
            }
        }
        
        function goToUserProfile(sender) {
            window.location.href = 'user-detail.html?name=' + encodeURIComponent(sender);
        }
        
        function updateUnreadCount() {
            let totalUnread = 0;
            let likesUnread = 0;
            let commentsUnread = 0;
            let followsUnread = 0;
            let systemUnread = 0;
            
            messagesData.all.forEach(msg => {
                if (msg.unread) {
                    totalUnread++;
                    if (msg.type === 'like') likesUnread++;
                    else if (msg.type === 'comment') commentsUnread++;
                    else if (msg.type === 'follow') followsUnread++;
                    else if (msg.type === 'system') systemUnread++;
                }
            });
            
            document.getElementById('totalUnread').textContent = totalUnread + '条未读';
            document.getElementById('allBadge').textContent = totalUnread;
            document.getElementById('likesBadge').textContent = likesUnread;
            document.getElementById('commentsBadge').textContent = commentsUnread;
            document.getElementById('followsBadge').textContent = followsUnread;
            document.getElementById('systemBadge').textContent = systemUnread;
            
            const headerBadge = document.getElementById('headerBadge');
            if (headerBadge) {
                headerBadge.textContent = totalUnread;
                headerBadge.style.display = totalUnread > 0 ? 'flex' : 'none';
            }
            
            if (likesUnread === 0) document.getElementById('likesBadge').style.display = 'none';
            if (commentsUnread === 0) document.getElementById('commentsBadge').style.display = 'none';
            if (followsUnread === 0) document.getElementById('followsBadge').style.display = 'none';
            if (systemUnread === 0) document.getElementById('systemBadge').style.display = 'none';
            if (totalUnread === 0) document.getElementById('allBadge').style.display = 'none';
        }
        
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabName = this.getAttribute('data-tab');
                renderMessages(tabName);
            });
        });
        
        updateUnreadCount();
        renderMessages('all');
    </script>
    
    <!-- 登录模态框 -->
    <div class="login-modal-overlay" id="loginModalOverlay">
        <div class="login-modal">
            <div class="login-modal-close" onclick="closeLoginModal()">✕</div>
            
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="0" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="90" y="15" width="8" height="30" rx="3" fill="#FF7F50"/>
                    <rect x="94" y="10" width="6" height="40" rx="2" fill="#FF7F50"/>
                    <rect x="15" y="27" width="70" height="6" rx="3" fill="#FF7F50"/>
                </svg>
                <div class="logo-text">健谈</div>
                <div class="logo-subtitle">FitChat</div>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="手机号 / 邮箱" id="username" required>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="密码" id="password" required>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">登录</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">其他登录方式</span>
                <div class="divider-line"></div>
            </div>
            
            <div class="social-icons">
                <div class="social-icon wechat" title="微信登录">
                    <img src="微信.webp" alt="微信" width="28" height="28">
                </div>
                <div class="social-icon qq" title="QQ 登录">
                    <img src="qq.webp" alt="QQ" width="28" height="28">
                </div>
            </div>
            
            <div class="register-section">
                <span class="register-text">还没有账号？</span>
                <a href="#" class="register-link">立即注册</a>
            </div>
        </div>
    </div>
    
    <!-- 分享模态框 -->
    <div class="share-modal-overlay" id="shareModalOverlay">
        <div class="share-modal">
            <div class="share-modal-close" onclick="closeShareModal()">✕</div>
            
            <div class="share-modal-content">
                <h3 class="share-title">分享到</h3>
                
                <div class="share-link-section">
                    <label>分享链接</label>
                    <div class="link-container">
                        <input type="text" id="shareLink" readonly>
                        <button onclick="copyLink()">复制</button>
                    </div>
                </div>
                
                <div class="share-platforms">
                    <div class="platform-item" onclick="shareToWeChat()">
                        <div class="platform-icon">
                            <img src="微信.webp" alt="微信" width="32" height="32">
                        </div>
                        <span>微信</span>
                    </div>
                    <div class="platform-item" onclick="shareToQQ()">
                        <div class="platform-icon">
                            <img src="qq.webp" alt="QQ" width="32" height="32">
                        </div>
                        <span>QQ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 登录模态框功能
        function openLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeLoginModal() {
            const modalOverlay = document.getElementById('loginModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        document.getElementById('loginModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLoginModal();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLoginModal();
                closeShareModal();
            }
        });
        
        // 分享模态框功能
        function openShareModal() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            const shareLinkInput = document.getElementById('shareLink');
            
            // 设置分享链接为当前页面URL
            shareLinkInput.value = window.location.href;
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeShareModal() {
            const modalOverlay = document.getElementById('shareModalOverlay');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        function copyLink() {
            const shareLinkInput = document.getElementById('shareLink');
            shareLinkInput.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            const copyBtn = shareLinkInput.nextElementSibling;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '已复制';
            copyBtn.style.background = '#4CAF50';
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '#FF7F50';
            }, 2000);
        }
        
        function shareToWeChat() {
            // 模拟微信分享
            alert('已复制链接到剪贴板，请在微信中粘贴分享');
            closeShareModal();
        }
        
        function shareToQQ() {
            // 模拟QQ分享
            const shareUrl = encodeURIComponent(window.location.href);
            const title = encodeURIComponent('健谈 FitChat - 消息通知');
            const qqShareUrl = `https://connect.qq.com/widget/shareqq/index.html?url=${shareUrl}&title=${title}`;
            window.open(qqShareUrl, '_blank', 'width=600,height=400');
        }
        
        document.getElementById('shareModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeShareModal();
            }
        });
    </script>
